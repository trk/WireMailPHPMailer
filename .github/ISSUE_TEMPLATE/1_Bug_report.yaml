name: 🐛 Bug Report
description: ⚠️ NEVER report security issues publicly, please contact us directly
labels: ["bug"]

body:
  - type: input
    id: affected-versions
    attributes:
      label: Version(s) affected
      placeholder: 1.5.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (ProcessWire & PHP version)
      description: Specify your ProcessWire version, PHP version, and whether multi-language support is installed
      placeholder: ProcessWire 3.0.275, PHP 8.5, single-language
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: |
        ⚠️ This is the most important part of the report ⚠️
        Without a way to easily reproduce your issue, there is little chance we will be able to help you and work on a fix.
        Please take the time to share the steps, code, or configuration needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: possible-solution
    attributes:
      label: Possible Solution
      description: |
        Optional: only if you have suggestions on a fix/reason for the bug.
        Don't hesitate to create a pull request with your solution, it helps get faster feedback.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: "Optional: any other context about the problem: log messages, screenshots, etc."
